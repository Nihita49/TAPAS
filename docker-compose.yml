services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tapas
      POSTGRES_USER: tapas
      POSTGRES_PASSWORD: tapas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapas -d tapas"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Live PostGIS read path (app falls back to JSON automatically if absent)
      DATABASE_URL: postgresql://tapas:tapas@db:5432/tapas
      # OpenWeatherMap One Call API 3.0 key (required for live weather; app falls
      # back to a clearly-labelled demo series if unset)
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      # Real Twilio sends: provide your credentials to enable (otherwise SIMULATED, honestly)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_TO: ${TWILIO_TO:-}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python backend/load_postgis.py; python backend/main.py"

volumes:
  pgdata:
